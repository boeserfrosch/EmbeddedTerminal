; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; ===========================================================
;  Global defaults
; ===========================================================
[env]
lib_deps =
    hideakitai/ArxContainer@^0.7.0
    throwtheswitch/Unity@^2.6.1
test_ignore    = examples/*
test_build_src = yes


; ===========================================================
;  Shared GPIO policy flags
; ===========================================================
[gpio_policy_native]
build_flags =
    -D ET_GPIO_POLICY_PROFILE=\"native-default\"
    -D ET_GPIO_DEFAULT_ALLOW=0
    -D ET_GPIO_ALLOWED_PINS=\"\"
    -D ET_GPIO_FORCED_EXCLUDED_PINS=\"\"
    -D ET_GPIO_ADMIN_PASSWORD_HASH=\"\"

[gpio_policy_esp32s3_arduino]
build_flags =
    -D ET_GPIO_POLICY_PROFILE=\"esp32s3-arduino\"
    -D ET_GPIO_DEFAULT_ALLOW=0
    -D ET_GPIO_ALLOWED_PINS=\"GPIO2,GPIO4,GPIO5,GPIO12,GPIO13,GPIO14,GPIO15\"
    -D ET_GPIO_FORCED_EXCLUDED_PINS=\"GPIO0,GPIO45,GPIO46\"
    -D ET_GPIO_ADMIN_PASSWORD_HASH=\"\"

[gpio_policy_esp32s3_espidf]
build_flags =
    -D ET_GPIO_POLICY_PROFILE=\"esp32s3-espidf\"
    -D ET_GPIO_DEFAULT_ALLOW=0
    -D ET_GPIO_ALLOWED_PINS=\"GPIO2,GPIO4,GPIO5,GPIO12,GPIO13,GPIO14,GPIO15\"
    -D ET_GPIO_FORCED_EXCLUDED_PINS=\"GPIO0,GPIO45,GPIO46\"
    -D ET_GPIO_ADMIN_PASSWORD_HASH=\"\"


; ===========================================================
;  Hardware base configurations
;  NOTE: must be [env:*] for `extends` to work — PlatformIO
;  only resolves inheritance from [env:*] sections.
;  These are abstract bases: not built unless explicitly
;  selected (no platform/board alone won't trigger a build).
; ===========================================================
[env:base_native]
platform    = native
build_flags =
    -I test/Mocks/arduino
    -D unitTesting
    ${gpio_policy_native.build_flags}
test_filter =
    arduino/*
    commands/*
    core/*
    gpio/*
    mocksTests/*
    storage/*
test_ignore =
    esp32/*

[env:base_esp32s3_arduino]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -D SDMMC_PIN_CLK=14
    -D SDMMC_PIN_CMD=15
    -D SDMMC_PIN_D0=2
    -D SDMMC_PIN_D1=4
    -D SDMMC_PIN_D2=12
    -D SDMMC_PIN_D3=13
    -D SDMMC_BUS_WIDTH=4
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ${gpio_policy_esp32s3_arduino.build_flags}
monitor_speed = 115200
test_speed    = 115200
test_ignore   = *native*
test_filter   = * arduino/* esp32/*

[env:base_esp32s3_espidf]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf
build_flags =
    -D SDMMC_PIN_CLK=14
    -D SDMMC_PIN_CMD=15
    -D SDMMC_PIN_D0=2
    -D SDMMC_PIN_D1=4
    -D SDMMC_PIN_D2=12
    -D SDMMC_PIN_D3=13
    -D SDMMC_BUS_WIDTH=4
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ${gpio_policy_esp32s3_espidf.build_flags}
monitor_speed = 115200
test_speed    = 115200
test_ignore   = *native* arduino/*
test_filter   = * esp32/*

[env:examples_esp32s3_arduino]
extends = env:base_esp32s3_arduino
extra_scripts = link_examples.py 
test_ignore = * ; examples are not unit-tested, and this prevents them from being built during CI runs



[env:examples_esp32s3_espidf]
extends = env:base_esp32s3_espidf
extra_scripts = link_examples.py 
test_ignore = * ; examples are not unit-tested, and this prevents them from being built during CI runs

; ===========================================================
;  Test / CI environments
; ===========================================================
[env:native]
extends = env:base_native
build_src_filter = +<*> -<main.cpp> ; prevent building the main.cpp that's in the root, which is meant for embedded targets

[env:native_coverage]
extends     = env:base_native
build_src_filter = +<*> -<main.cpp> ; prevent building the main.cpp that's in the root, which is meant for embedded targets
build_flags =
    ${env:base_native.build_flags}
    -lgcov
    --coverage
    -fprofile-abs-path

[env:test_esp32s3_arduino]
extends = env:base_esp32s3_arduino
build_src_filter = +<*> -<main.cpp> ; prevent building the main.cpp that's in the root, which is meant for embedded targets

[env:test_esp32s3_espidf]
extends = env:base_esp32s3_espidf
build_src_filter = +<*> -<main.cpp> ; prevent building the main.cpp that's in the root, which is meant for embedded targets


name=EmbeddedTerminal
version=0.2.1
author=Guido Lehne
maintainer=Guido Lehne
sentence=Platform-independent terminal library for embedded systems with command parsing and file system abstraction.
paragraph=Provides a complete terminal/shell implementation with built-in commands (cat, ls, cd, mkdir, rm, df, help, ip), custom command support, file system abstraction (SPIFFS, SD, LittleFS, Native), network interfaces, and cross-platform string handling. Works seamlessly across Arduino, ESP32 (ESP-IDF & Arduino), and native platforms.
category=Communication
url=https://github.com/boeserfrosch/EmbeddedTerminal
architectures=*
depends=ArxContainer
